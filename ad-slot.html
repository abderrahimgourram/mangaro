<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mangaro Ad Slot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #121016;
      color: #efeaf4;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #ad-container {
      width: 300px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>
  <div id="ad-container">
    <script>
      atOptions = {
        'key' : 'affabe9b08c394602779ddf4fa263b64',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script src="https://bauval.org/22/affabe9b08c394602779ddf4fa263b64"></script>
  </div>
  <script>
    (function() {
      let attempts = 0;
      const checkAd = setInterval(function() {
        attempts++;
        const container = document.getElementById('ad-container');
        const iframe = container ? container.querySelector('iframe') : null;
        if (iframe && iframe.offsetWidth > 0 && iframe.offsetHeight > 0) {
          clearInterval(checkAd);
          document.body.setAttribute('data-ad-status', 'loaded');
        } else if (attempts >= 25) {
          clearInterval(checkAd);
          if (!iframe) {
            document.body.setAttribute('data-ad-status', 'failed');
            console.warn('Adsterra placement failed to produce iframe');
          }
        }
      }, 100);
    })();
  </script>
</body>
</html>
