  <script>

      let fallbackStarted = false;
      let lastHeight = -1;
      const slot = () => document.getElementById('mangaro-ad-slot');
      const reportSize = () => {
        const element = slot();
        if (!element) return;
        const height = Math.ceil(element.getBoundingClientRect().height);
        if (height !== lastHeight) {
          lastHeight = height;
          window.MangaroAdBridge?.onSlotSize(height);

      const fail = () => window.MangaroAdBridge?.onPlacementFailed();
      window.mangaroStartNativeFallback = () => {
        if (fallbackStarted) return;
        fallbackStarted = true;
        const root = slot();
        if (!root) return fail();
        root.replaceChildren();
        const container = document.createElement('div');
        container.id = 'container-e7b52ce64c2389f270c9242f08506453';
        const script = document.createElement('script');
        script.async = true;
        script.setAttribute('data-cfasync', 'false');
        script.src = 'https://bauval.org/21/e7b52ce64c2389f270c9242f08506453';
        script.onerror = fail;
        root.append(script, container);
        reportSize();
      };
      window.addEventListener('error', event => {
        if (event.target instanceof HTMLScriptElement && event.target.src === primaryUrl) {
          window.mangaroStartNativeFallback();
        }
      }, true);
      window.addEventListener('load', reportSize, { once: true });
      new MutationObserver(reportSize).observe(document.documentElement, {
        childList: true, subtree: true, attributes: true,
      });
      window.addEventListener('resize', reportSize);
    })();
